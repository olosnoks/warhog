[env:freenove-s3-cyd-ham-ui4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = freenove_fnk0104b
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    ; Scheduler features — LIVE in the released flasher build. Phases 1-4:
    ; worker dedup, adaptive dwell + DFS-passive, dynamic yield assignment
    ; (ADMIN_EXT, Core role), and core-0 SD isolation behind the shared SPI-bus
    ; mutex (SpiBusLock.h). See scheduler/DESIGN.md.
    -I../scheduler
    -I../common
    -DPIG_FEAT_DEDUP=1
    -DPIG_FEAT_ADAPTIVE_DWELL=1
    -DPIG_FEAT_PAIR_SCHED=1
    -DPIG_FEAT_DYNAMIC_ASSIGN=1
    -DPIG_FEAT_CORE_ISO=1

    ; Let our ieee80211_raw_frame_sanity_check() override the strong symbol in
    ; libnet80211.a so raw 802.11 injection (beacon spam / deauth) works.
    -Wl,--allow-multiple-definition

    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    mikalhart/TinyGPSPlus@1.1.0
    bblanchon/ArduinoJson@6.21.5
    h2zero/NimBLE-Arduino@2.5.1

; -----------------------------------------------------------------------------
; Guition JC8048W550 — ESP32-S3 N16R8, 5" 800x480 RGB IPS + GT911 touch.
; Same SoC as the Freenove board, so all Wi-Fi/BLE/GPS/mesh code is shared; this
; env swaps the display stack (TFT_eSPI SPI -> LovyanGFX RGB) and the SD backend
; (SDIO -> SPI). See LGFX_W550.h / Gfx.h / BoardPins.h for the board specifics.
; -----------------------------------------------------------------------------
[env:guition-jc8048w550]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
    ; Scheduler features — LIVE in the released flasher build. Phases 1-4:
    ; worker dedup, adaptive dwell + DFS-passive, dynamic yield assignment
    ; (ADMIN_EXT, Core role), and core-0 SD isolation behind the shared SPI-bus
    ; mutex (SpiBusLock.h). See scheduler/DESIGN.md.
    -I../scheduler
    -I../common
    -DPIG_FEAT_DEDUP=1
    -DPIG_FEAT_ADAPTIVE_DWELL=1
    -DPIG_FEAT_PAIR_SCHED=1
    -DPIG_FEAT_DYNAMIC_ASSIGN=1
    -DPIG_FEAT_CORE_ISO=1

    ; Raw 802.11 injection override (same as the Freenove env).
    -Wl,--allow-multiple-definition

    ; Select the LovyanGFX RGB backend + this board's pin map.
    -D BOARD_W550=1
    -D LGFX_USE_V1=1

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    mikalhart/TinyGPSPlus@1.1.0
    bblanchon/ArduinoJson@6.21.5
    h2zero/NimBLE-Arduino@2.5.1
