

# ============================================================
# WarHog Wardriver Configuration — XIAO (S3 / C5 / C6)
# Format: key=value
# Lines starting with # are comments and ignored.
# ============================================================


# ------------------------------------------------------------
# WiGLE Upload
# ------------------------------------------------------------
# Use Only the "Encoded for Use" token
# Get it here: https://wigle.net/account
# Leave empty to disable WiGLE uploads.

wigleBasicToken=EnterWigleTokenForUseTokenHere


# ------------------------------------------------------------
# WatchDogGoWars
# ------------------------------------------------------------
# Get your API key here: https://wdgwars.pl/profile/
# Add your API Key Below


wdgwarsApiKey=EnterWatchDogsGoAPITokenHere

# ------------------------------------------------------------
# Max Automatic Uploads
# ------------------------------------------------------------
# Values are True or False
# This will set a max for uploads on WatchdogsGoWars as well as Wigle
# -1 = Uploads ALL pending files Everyboot
#  0 = Disabled - No Auto-Upload at boot, you will manually pull the files off SD card OR use the web interface to upload files
#  1-100 = Entering any value from 1 to 100 will be the cap for how many uploads it will auto upload.  ie if you put 25, it will only upload 25 files at a time.

maxBootUploads=-1



# ------------------------------------------------------------
# Home Wi-Fi (STA mode)
# ------------------------------------------------------------
# If provided, device will attempt to connect on boot.
# If connection fails, it falls back to SoftAP for 60 seconds.

homeSsid=EnterWifiHere
homePsk=EnterWifiPasswordHere


# ------------------------------------------------------------
# Wardriver Access Point (SoftAP fallback)
# ------------------------------------------------------------
# SSID and password for the temporary config AP.
# Password must be ≥8 characters or AP becomes open.
wardriverSsid=WarHog-WARDRIVE
wardriverPsk=wardrive1234


# ------------------------------------------------------------
# GPS Settings
# ------------------------------------------------------------
# UART baud rate for the GPS module.
# Common values: 9600, 38400, 115200
gpsBaud=9600


# ------------------------------------------------------------
# Wi-Fi Scan Mode
# ------------------------------------------------------------
# aggressive  → scans every ~4.5 seconds (faster discovery, more power use)
# powersaving → scans every ~12 seconds (slower, less power)

scanMode=aggressive


# ------------------------------------------------------------
# Speed Units (display only)
# ------------------------------------------------------------
# kmh → kilometers per hour
# mph → miles per hour

speedUnits=mph


# ------------------------------------------------------------
# battery Test
# ------------------------------------------------------------
#Values are True or False
#Will print seconds active when on battery power

batteryTest=false

# ------------------------------------------------------------
# Device Name
# ------------------------------------------------------------
# Optional.  Alphanumeric, hyphens and underscores only (max 20 chars).
# This value is appended to the WiGLE CSV header device field and
# prepended to the filename so multiple wardrivers uploading to the
# same account can be distinguished.
#
# Examples:
#   deviceName=rover1        -> device=WarHog-rover1       / rover1_WarHog_WiGLE_....csv
#   deviceName=backpack-2    -> device=WarHog-backpack-2   / backpack-2_WarHog_WiGLE_....csv
# Leave empty (or remove) for the default: device=WarHog-Wardriver

deviceName=


# ------------------------------------------------------------
# Board Type
# ------------------------------------------------------------
# Overrides automatic chip detection for pin mapping.
# auto = detect from chip model (default)
# s3   = XIAO ESP32-S3
# c5   = XIAO ESP32-C5 (required for 5 GHz scanning)
# c6   = XIAO ESP32-C6
# exp  = XIAO ESP32-S3 + Expansion Base
# Reboot required after changing.

board=auto


# ------------------------------------------------------------
# Mesh Mode On Boot
# ------------------------------------------------------------
# Automatically enter ESP-Now mesh mode after boot uploads complete.
# Bypasses the SoftAP window and jumps directly to the mesh page.
#
#   none = Normal solo wardriving mode (default, boots to PigWorld scene)
#   core = Start as Mesh Core (coordinator) — logs data from nodes
#   node = Start as Mesh Node — forwards scan results to a Core
#          (compatible with Biscuit Pro and JCMK C5 Wardriver)

meshModeOnBoot=none


# ------------------------------------------------------------
# BLE Companion App Bridge
# ------------------------------------------------------------
# Stream scan results over BLE in Solo and Mesh Node modes (Mesh Core mode
# always streams). Default personality is "wardrivego" (iosESP-XXXX).
blePhoneSolo=true
blePersonality=wardrivego


# ------------------------------------------------------------
# Screen Rotation
# ------------------------------------------------------------
# Rotate the display 180 degrees for upside-down mounting.
# Values: true or false
# Reboot required after changing.

rotateScreen180=false


# ------------------------------------------------------------
# Auto-Start Wardriving After Uploads
# ------------------------------------------------------------
# When true: disconnects from home Wi-Fi immediately after boot uploads
# complete and begins wardriving without delay.  The web UI remains
# accessible if you later connect to the Wardriver AP, but the device
# will not hold the STA link open while driving.
# Values: true or false
# Reboot required after changing.

autoStartAfterUpload=false


# ------------------------------------------------------------
# Wardrift Upload  (upstream v2.7)
# ------------------------------------------------------------
# Third upload service alongside WiGLE and WDGoWars.
# Get your API key (wdk_...) here: https://wardrift.net
# Leave empty to disable Wardrift uploads.

wardriftApiKey=


# ------------------------------------------------------------
# Upload When Home Network Seen  (upstream v2.63)
# ------------------------------------------------------------
# When true, the device connects and uploads pending CSVs automatically
# if your homeSsid is seen while wardriving, then resumes once out of range.
# Mutually exclusive with autoStartAfterUpload (that one forces this off).
# Values: true or false

uploadOnNetworkSeen=true


# ------------------------------------------------------------
# Network Whitelist  (upstream v2.63)
# ------------------------------------------------------------
# Up to 10 SSIDs that are scanned but never written to the WiGLE CSV log.
# Matching is exact and case-sensitive; whitelisted networks still count
# toward Found totals. One SSID per key; leave empty to disable.

ssidWhitelist1=
ssidWhitelist2=
ssidWhitelist3=
ssidWhitelist4=
ssidWhitelist5=
ssidWhitelist6=
ssidWhitelist7=
ssidWhitelist8=
ssidWhitelist9=
ssidWhitelist10=


# ------------------------------------------------------------
# SD Card Max SPI Clock  (upstream v2.62)
# ------------------------------------------------------------
# Caps the SD-over-SPI clock (Hz). Boot negotiates the fastest working
# speed up to this value. Lower it if you see SD write errors.
# Default: 20000000 (20 MHz)

sdMaxSpiHz=20000000
